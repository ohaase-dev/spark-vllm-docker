# Recipe: Qwen3.6-35B-A3B-PrismQuant-4.75bit
# Qwen3.6-35B model in PriusmQuant quantization

recipe_version: "1"
name: Qwen3.5-122B-A10B-PrismaQuant-4.75bit
description: vLLM serving Qwen3.5-122B-A10B-PrismaQuant-4.75bit

# HuggingFace model to download (optional, for --download-model)
model: rdtand/Qwen3.5-122B-A10B-PrismaQuant-4.75bit-vllm

solo_only: true

# Container image to use
container: vllm-node-tf5

build_args:
  - --tf5

# Mod required to fix ROPE syntax error
mods:
  - mods/fix-qwen3.5-enhanced-chat-template
  - mods/fix-nixl-cu13

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  gpu_memory_utilization: 0.85
  max_model_len: 32768
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'

# Environment variables
env:
  VLLM_USE_FLASHINFER_NVFP4: 1

# The vLLM serve command template
command: |
  vllm serve rdtand/Qwen3.5-122B-A10B-PrismaQuant-4.75bit-vllm \
    --port {port} \
    --host {host} \
    --load-format instanttensor \
    --trust-remote-code \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --default-chat-template-kwargs '{default-chat-template-kwargs}' \
    --speculative-config '{speculative_config}'