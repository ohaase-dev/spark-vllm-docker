# Recipe: Qwen3.6-35B-A3B-PrismQuant-4.75bit
# Qwen3.6-35B model in PriusmQuant quantization

recipe_version: "1"
name: Qwen3.6-35B-A3B-PrismQuant-4.75bit
description: vLLM serving Qwen3.6-35B-A3B-PrismQuant-4.75bit

# HuggingFace model to download (optional, for --download-model)
model: rdtand/Qwen3.6-35B-A3B-PrismQuant-4.75bit-vllm

solo_only: true

# Container image to use
container: vllm-node-tf5

build_args:
  - --tf5

# Mod required to fix ROPE syntax error
# mods:
#  - mods/fix-qwen3.5-enhanced-chat-template

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'

# Environment variables
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  FLASHINFER_DISABLE_VERSION_CHECK: 1

# The vLLM serve command template
command: |
  vllm serve rdtand/Qwen3.6-35B-A3B-PrismQuant-4.75bit-vllm \
    --port {port} \
    --host {host} \
    --load-format instanttensor \
    --enable-chunked-prefill \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --quantization compressed-tensors \
    --attention_backend flashinfer \
    --trust-remote-code \
    --speculative-config '{speculative_config}' \
    --enable-prefix-caching